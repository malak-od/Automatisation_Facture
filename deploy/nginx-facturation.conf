# ============================================================================
#  nginx — Facturation  (slug : facturation)
#  Machine : VM APP Linux 192.168.5.200   (PAS la VM qui exécute l'app)
#
#  Périmètre : `facturation` est l'application de facturation de la maison,
#  TOUS périmètres confondus. Le module transporteurs en est le premier ;
#  les suivants (clients, fournisseurs…) viendront DANS cette même app, sous
#  le même domaine, le même provider Authentik et le même service. Il n'y a
#  donc qu'un seul objet à créer dans chaque console — pas un par périmètre.
#
#  Rôle : point d'entrée HTTP de l'app + application du SSO Authentik en
#  forward-auth (auth_request). L'app Node elle-même n'a AUCUNE
#  authentification : c'est ce fichier qui la protège. Ne pas exposer le port
#  4000 de la VM Windows ailleurs que vers cette VM (cf. DEPLOIEMENT.md §5).
#
#  Production uniquement — pas d'instance de recette pour cette app.
#
#  Chaîne complète :
#     navigateur ─> NPM (192.168.5.11, TLS du domaine)
#                ─> nginx ICI (192.168.5.200:3500)
#                     └─ auth_request ─> Authentik (outpost embarqué)
#                ─> node server.js sur la VM WINDOWS dédiée :4000
#                     └─ Excel COM (pywin32) — d'où l'hébergement Windows
#                        (pourquoi pas ici : DEPLOIEMENT.md §9)
#
#  Installation :
#     sudo cp deploy/nginx-facturation.conf \
#             /etc/nginx/sites-available/facturation
#     sudo ln -s /etc/nginx/sites-available/facturation \
#                /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Prérequis : module ngx_http_auth_request_module (présent dans les paquets
#  nginx Debian/Ubuntu standard — vérifier : nginx -V 2>&1 | grep auth_request).
# ============================================================================

# ---------------------------------------------------------------------------
#  IP FIXE de la VM Windows qui héberge l'app (celle où Excel est installé et
#  où tourne le service `facturation`). Elle DOIT rester fixe : nginx la code
#  en dur, une IP qui bouge = 502 un matin sans que personne n'ait rien touché.
#  Tout le reste du fichier est générique.
# ---------------------------------------------------------------------------
upstream facturation_app {
    server 192.168.5.74:4000;      # VM `facturation-app` (RDP admin : port 2547)
    keepalive 8;
}

# ---------------------------------------------------------------------------
#  Authentik — outpost embarqué.
#  On tape le serveur Authentik EN DIRECT (192.168.5.55), et NON via
#  auth.intra… : l'outpost choisit le provider d'après l'en-tête `Host`, or
#  NPM route lui aussi d'après le `Host`. Passer par NPM avec
#  `Host: facturation.intra…` n'atteindrait jamais Authentik.
#  Si le port 9443 n'est pas joignable depuis la VM, basculer sur le port HTTP
#  interne : http://192.168.5.55:9000 (voir DEPLOIEMENT.md §4, vérification).
#  La vérification du certificat backend est désactivée par défaut dans nginx
#  (proxy_ssl_verify off) : le certificat porte auth.intra…, pas l'IP.
# ---------------------------------------------------------------------------

# ===========================================================================
#  PRODUCTION — facturation.intra.laruche-logistique-france.fr
# ===========================================================================
server {
    listen 3500;
    listen [::]:3500;
    server_name facturation.intra.laruche-logistique-france.fr;

    # TLS assuré par NPM en amont : on reste en HTTP ici (VLAN serveurs).

    access_log /var/log/nginx/facturation.access.log;
    error_log  /var/log/nginx/facturation.error.log;

    # Dépôt de factures transporteurs (PDF + classeurs Excel) : la valeur par
    # défaut de nginx (1 Mo) rejetterait les envois avec un 413 illisible.
    client_max_body_size 200m;
    client_body_timeout  300s;

    # --- Endpoint de l'outpost Authentik (login, callback, déconnexion) ------
    location /outpost.goauthentik.io {
        proxy_pass              https://192.168.5.55:9443/outpost.goauthentik.io;
        proxy_set_header        Host $host;
        proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
        add_header              Set-Cookie $auth_cookie;
        auth_request_set        $auth_cookie $upstream_http_set_cookie;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    # --- Point d'entrée de connexion quand la session manque -----------------
    location @goauthentik_proxy_signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 /outpost.goauthentik.io/start?rd=$request_uri;
    }

    # --- L'application, protégée par le SSO ---------------------------------
    location / {
        auth_request     /outpost.goauthentik.io/auth/nginx;
        error_page       401 = @goauthentik_proxy_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header       Set-Cookie $auth_cookie;

        # Identité transmise à l'app (elle ne les lit pas aujourd'hui, mais ces
        # en-têtes sont la seule façon de savoir QUI a lancé une génération le
        # jour où on voudra tracer les exécutions — cf. AUTHENTIK.md §5).
        # Elles serviront aussi à ouvrir/masquer les futurs périmètres de
        # facturation selon le groupe de l'utilisateur (X-authentik-groups).
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        auth_request_set $authentik_name     $upstream_http_x_authentik_name;
        auth_request_set $authentik_uid      $upstream_http_x_authentik_uid;

        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-groups   $authentik_groups;
        proxy_set_header X-authentik-email    $authentik_email;
        proxy_set_header X-authentik-name     $authentik_name;
        proxy_set_header X-authentik-uid      $authentik_uid;

        # ⚠️ Un client peut forger ces en-têtes s'il joint la VM Windows en
        # direct. Le pare-feu Windows doit n'accepter le port 4000 QUE depuis
        # 192.168.5.200 (DEPLOIEMENT.md §5) — sans ça, le SSO est contournable.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # La génération pilote Excel via COM : plusieurs minutes sur un gros
        # transporteur. Les 60 s par défaut couperaient en plein traitement, et
        # l'utilisateur verrait un 504 alors qu'Excel continue à travailler.
        # Le même relèvement est à faire côté NPM (onglet Advanced) — sinon
        # c'est NPM qui coupe à 60 s, en amont de ce fichier.
        proxy_connect_timeout 15s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # Les classeurs générés sont servis en flux : pas de mise en tampon.
        proxy_buffering off;

        proxy_pass http://facturation_app;
    }
}
