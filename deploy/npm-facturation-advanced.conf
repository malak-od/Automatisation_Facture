# ============================================================================
#  NPM — Proxy Host `facturation.intra.laruche-logistique-france.fr`
#  À COLLER DANS L'ONGLET **Advanced** DU PROXY HOST (NPM : 192.168.5.11:81)
#
#  ⚠️ Ce fichier n'est PAS lu par NPM. C'est une copie de référence, versionnée
#     parce que la vraie configuration vit dans un champ texte d'interface web :
#     pas de `nginx -t`, pas d'historique, et elle disparaît si quelqu'un
#     recrée le Proxy Host. **Le tenir à jour à chaque modification dans NPM.**
#
#  Onglet Details du même Proxy Host :
#     Scheme http · Forward 192.168.5.74 · Port 4000 · Websockets ON
#     Cache Assets **OFF** (voir DEPLOIEMENT.md §3 : une réponse en cache
#     échapperait à auth_request, et l'app diffuse des factures générées)
#  Onglet SSL : certificat du domaine + Force SSL
#
#  Chaîne complète :
#     navigateur ─> NPM (192.168.5.11, TLS + forward-auth)
#                     └─ auth_request ─> Authentik (192.168.5.55:9443)
#                ─> node server.js sur la VM Windows CRE1-SV-EXEL-01 :4000
#                     └─ Excel COM (pywin32) — pourquoi pas sur Linux :
#                        DEPLOIEMENT.md §9
#
#  Il n'y a AUCUN nginx intermédiaire sur 192.168.5.200 : le socle commun
#  (§2.d) fait de NPM l'unique reverse-proxy, tapant directement le port de
#  l'app. NPM *est* nginx.
# ============================================================================

# --- Dépôt de factures (PDF + classeurs) ------------------------------------
# La valeur par défaut de nginx (1 Mo) rejetterait les envois avec un 413
# illisible.
client_max_body_size 200m;
client_body_timeout  300s;

# --- Générations longues ----------------------------------------------------
# La génération pilote Excel via COM : plusieurs minutes sur un gros
# transporteur (le modèle UPS porte ~200 000 formules XLOOKUP). Les 60 s par
# défaut couperaient en plein traitement, et l'utilisateur verrait un 504
# alors qu'Excel continue à travailler. C'est le piège des ~60 s du socle
# commun §2.d.
proxy_connect_timeout 15s;
proxy_send_timeout    900s;
proxy_read_timeout    900s;

# Les classeurs générés sont servis en flux : pas de mise en tampon.
proxy_buffering off;

# --- Forward-auth Authentik -------------------------------------------------
# Ces directives sont héritées par le `location /` que NPM génère lui-même.
# L'app Node n'a AUCUNE authentification : c'est cette barrière qui la protège.
# Elle ne vaut que si le pare-feu Windows interdit l'accès direct au port 4000
# depuis autre chose que 192.168.5.11 (DEPLOIEMENT.md §5).
auth_request     /outpost.goauthentik.io/auth/nginx;
error_page       401 = @goauthentik_proxy_signin;
auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header       Set-Cookie $auth_cookie;

# --- Endpoint de l'outpost (login, callback, déconnexion) -------------------
# On tape le serveur Authentik EN DIRECT (192.168.5.55), et non via
# auth.intra… : l'outpost choisit le provider d'après l'en-tête `Host`, or NPM
# route lui aussi d'après le `Host`. Passer par NPM avec
# `Host: facturation.intra…` n'atteindrait jamais Authentik.
location /outpost.goauthentik.io {
    proxy_pass              https://192.168.5.55:9443/outpost.goauthentik.io;
    proxy_ssl_verify        off;   # le certificat porte auth.intra…, pas l'IP
    proxy_set_header        Host $host;
    proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
    add_header              Set-Cookie $auth_cookie;
    auth_request_set        $auth_cookie $upstream_http_set_cookie;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";

    # ⚠️ Sans ce `off`, ce bloc s'authentifie lui-même : boucle infinie.
    auth_request            off;
}

# --- Point d'entrée de connexion quand la session manque --------------------
location @goauthentik_proxy_signin {
    internal;
    add_header Set-Cookie $auth_cookie;
    return 302 /outpost.goauthentik.io/start?rd=$request_uri;
    auth_request off;
}

# ============================================================================
#  🪤 CE QUI MANQUE VOLONTAIREMENT : les en-têtes X-authentik-*
#
#  En nginx, les `proxy_set_header` d'un niveau supérieur sont ignorés dès
#  qu'une `location` en définit un seul — et le `location /` généré par NPM en
#  définit plusieurs. Poser ici `proxy_set_header X-authentik-username …`
#  n'aurait donc aucun effet : l'app ne recevrait rien.
#
#  Sans conséquence aujourd'hui : `facturation-app/server.js` ignore ces
#  en-têtes. Mais pour les deux évolutions prévues (AUTHENTIK.md §5) — tracer
#  qui a généré quelle facture, et filtrer les périmètres selon les groupes —
#  il faudra reprendre la main sur `location /` via l'onglet **Custom
#  Locations** de NPM, et y déclarer :
#
#     auth_request_set $authentik_username $upstream_http_x_authentik_username;
#     auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;
#     auth_request_set $authentik_email    $upstream_http_x_authentik_email;
#     auth_request_set $authentik_name     $upstream_http_x_authentik_name;
#     auth_request_set $authentik_uid      $upstream_http_x_authentik_uid;
#
#     proxy_set_header X-authentik-username $authentik_username;
#     proxy_set_header X-authentik-groups   $authentik_groups;
#     proxy_set_header X-authentik-email    $authentik_email;
#     proxy_set_header X-authentik-name     $authentik_name;
#     proxy_set_header X-authentik-uid      $authentik_uid;
#
#  … en reprenant aussi les proxy_set_header standards (Host, X-Real-IP,
#  X-Forwarded-*) que NPM posait pour nous.
# ============================================================================
