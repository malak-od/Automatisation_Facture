<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Facturation Transporteurs</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --muted:#64748b; --line:#334155; --fg:#e2e8f0;
          --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --plan:#475569; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:13px; }
  .layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 57px); }
  aside { border-right:1px solid var(--line); padding:14px; overflow:auto; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:6px 6px 10px; }
  .carrier { display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px; }
  .carrier:hover { background:#0b1222; }
  .carrier.active { background:#0b3b52; outline:1px solid var(--accent); }
  .carrier .name { flex:1; }
  .badge { font-size:10px; padding:2px 7px; border-radius:999px; font-weight:600; }
  .badge.ready { background:rgba(34,197,94,.15); color:var(--ok); }
  .badge.planned { background:rgba(71,85,105,.35); color:#94a3b8; }
  .badge.viti { background:rgba(56,189,248,.15); color:var(--accent); }
  main { padding:24px 28px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .method { color:#cbd5e1; }
  .kv { color:var(--muted); font-size:13px; margin-top:6px; }
  .kv b { color:#cbd5e1; font-weight:600; }
  .drop { border:1.5px dashed var(--line); border-radius:10px; padding:14px; margin:10px 0; }
  .drop label { display:block; font-weight:600; margin-bottom:6px; }
  .drop input { width:100%; color:var(--muted); }
  .drop .req { color:var(--warn); }
  .filelist { list-style:none; margin:0 0 8px; padding:0; display:flex; flex-direction:column; gap:5px; }
  .filelist li { display:flex; align-items:center; gap:8px; background:#0b1222; border:1px solid var(--line);
                 border-radius:7px; padding:6px 10px; font-size:12.5px; color:#cbd5e1; }
  .filelist li .fname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .filelist li button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 2px; }
  .filelist li button:hover { color:#ef4444; }
  .addfile { background:#0b1222; border:1px dashed var(--line); color:var(--muted); border-radius:7px;
             padding:7px 12px; cursor:pointer; font-size:12.5px; }
  .addfile:hover { border-color:var(--accent); color:var(--accent); }
  button.go { background:var(--accent); color:#04283a; border:0; padding:11px 20px; border-radius:9px; font-weight:700; cursor:pointer; font-size:14px; }
  button.go:disabled { opacity:.5; cursor:not-allowed; }
  .plan-note { color:var(--warn); background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); border-radius:10px; padding:12px 14px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td,th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .total { font-size:22px; font-weight:700; color:var(--ok); }
  .dl a { display:inline-block; margin-right:10px; margin-top:8px; background:#0b1222; border:1px solid var(--line);
          color:var(--fg); padding:9px 14px; border-radius:8px; text-decoration:none; }
  .dl a:hover { border-color:var(--accent); }
  .alerts { max-height:220px; overflow:auto; font-size:12.5px; color:#fbbf24; margin-top:8px; }
  .alerts div { padding:2px 0; }
  .spinner { color:var(--muted); }

  header h1 { cursor:pointer; }
  header h1:hover { color:var(--accent); }

  .home { padding:6px 4px 24px; }
  .home h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 14px;
          display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer;
          text-align:center; transition:transform .12s ease, border-color .12s ease; position:relative; }
  .tile:hover { transform:translateY(-2px); border-color:var(--accent); }
  .tile-badge { width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center;
                font-weight:800; font-size:15px; letter-spacing:.02em; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25);
                box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .tile-logo-img { width:56px; height:56px; border-radius:12px; object-fit:contain; background:#fff; padding:6px; }
  .tile-name { font-size:13px; font-weight:600; line-height:1.25; }
  .tile-tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  .tile .badge { font-size:9px; }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">🚚 Facturation Transporteurs</h1>
  <span class="sub">Automatisation multi-transporteurs — Kuehne opérationnel, autres planifiés</span>
</header>
<div class="layout">
  <aside>
    <h2>Transporteurs</h2>
    <div id="list"></div>
  </aside>
  <main id="main"><p class="spinner">Chargement…</p></main>
</div>

<script>
let CARRIERS = [], current = null;

// Couleurs de marque APPROXIMATIVES (pas de vrais logos disponibles pour l'instant).
// Pour brancher un vrai logo : deposer public/logos/<id>.png (ou .svg) -> pris automatiquement,
// le badge colore ne sert plus que de repli si l'image est absente/en erreur.
const BRANDS = {
  kuehne:        { initials: 'K+N', color: '#00447C' },
  delivengo:     { initials: 'DGO', color: '#8B2FC9' },
  dpd:           { initials: 'DPD', color: '#DC0032' },
  ups:           { initials: 'UPS', color: '#351C15' },
  geodis:        { initials: 'GEO', color: '#E9631A' },
  gls:           { initials: 'GLS', color: '#1D4EAF' },
  colissimo:     { initials: 'COL', color: '#D9A800' },
  chronopost:    { initials: 'CHR', color: '#E2007A' },
  fedex:         { initials: 'FDX', color: '#4D148C' },
  tnt:           { initials: 'TNT', color: '#FF6200' },
  mondial_relay: { initials: 'MR',  color: '#00A651' },
  lettres:       { initials: '✉',  color: '#64748B' },
  bls:           { initials: 'BLS', color: '#2563EB' },
};

// Cherche logos/<id>.svg puis logos/<id>.png ; repli sur le badge colore si aucun n'existe.
function logoOrBadge(c) {
  return `<img class="tile-logo-img" src="/logos/${c.id}.svg" alt="${c.name}" data-id="${c.id}" onerror="logoFallback(this)">`;
}

function logoFallback(img) {
  if (img.dataset.tried !== 'png') {
    img.dataset.tried = 'png';
    img.src = `/logos/${img.dataset.id}.png`;
    return;
  }
  const b = BRANDS[img.dataset.id] || { initials: img.alt.slice(0,3).toUpperCase(), color: '#475569' };
  const badge = document.createElement('div');
  badge.className = 'tile-badge';
  badge.style.background = b.color;
  badge.textContent = b.initials;
  img.replaceWith(badge);
}

async function load() {
  CARRIERS = await (await fetch('/api/carriers')).json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  // prêts d'abord, puis planifiés
  CARRIERS.sort((a,b)=> (a.status==='ready'?0:1)-(b.status==='ready'?0:1) || a.name.localeCompare(b.name));
  for (const c of CARRIERS) {
    const el = document.createElement('div');
    el.className = 'carrier';
    el.innerHTML = `<span class="name">${c.name}</span>
      ${c.viticolis?'<span class="badge viti">Viticolis</span>':''}
      <span class="badge ${c.status}">${c.status==='ready'?'prêt':'à venir'}</span>`;
    el.onclick = () => select(c.id, el);
    list.appendChild(el);
  }
  goHome();
}

function goHome() {
  current = null;
  document.querySelectorAll('.carrier').forEach(n=>n.classList.remove('active'));
  const m = document.getElementById('main');
  const tiles = CARRIERS.map(c => `
    <div class="tile" onclick="selectFromHome('${c.id}')">
      ${logoOrBadge(c)}
      <div class="tile-name">${c.name}</div>
      <div class="tile-tags">
        ${c.viticolis?'<span class="badge viti">Viticolis</span>':''}
        <span class="badge ${c.status}">${c.status==='ready'?'prêt':'à venir'}</span>
      </div>
    </div>`).join('');
  m.innerHTML = `<div class="home"><h2>Choisir un transporteur</h2><div class="grid">${tiles}</div></div>`;
}

function selectFromHome(id) {
  const idx = CARRIERS.findIndex(c=>c.id===id);
  select(id, document.getElementById('list').children[idx]);
}

function select(id, el) {
  current = CARRIERS.find(c=>c.id===id);
  document.querySelectorAll('.carrier').forEach(n=>n.classList.remove('active'));
  if (el) el.classList.add('active');
  render();
}

function render() {
  const c = current, m = document.getElementById('main');
  let html = `<div class="card"><h3>${c.name}</h3>
    <div class="method">${c.method||''}</div>
    <div class="kv"><b>Taxe gasoil :</b> ${c.taxeGasoil||'—'}</div></div>`;

  if (c.status !== 'ready') {
    html += `<div class="card"><div class="plan-note">⏳ Transporteur <b>planifié</b> — méthode connue, implémentation à venir.
      Documents attendus : ${(c.inputs||[]).map(i=>i.label).join(', ')||'à définir'}.</div></div>`;
    m.innerHTML = html; return;
  }

  html += `<div class="card"><h3>1. Déposer les documents fournis par ${c.name}</h3><form id="form">`;
  for (const inp of c.inputs) {
    if (inp.multiple) {
      // fichiers accumules en JS (pickedFiles) : re-selectionner n'ecrase pas ceux deja choisis,
      // contrairement au comportement natif d'un <input type="file" multiple">.
      html += `<div class="drop" data-key="${inp.key}">
        <label>${inp.label} ${inp.required?'<span class="req">*</span>':''}</label>
        <ul class="filelist" id="filelist-${inp.key}"></ul>
        <button type="button" class="addfile" onclick="pickMore('${inp.key}','${inp.accept}')">+ Ajouter un ou plusieurs fichiers</button>
      </div>`;
    } else {
      html += `<div class="drop"><label>${inp.label} ${inp.required?'<span class="req">*</span>':''}</label>
        <input type="file" name="${inp.key}" accept="${inp.accept}" ${inp.required?'required':''}></div>`;
    }
  }
  html += `<button class="go" type="submit">Générer l'import + le classeur</button></form></div>
    <div id="result"></div>`;
  m.innerHTML = html;
  pickedFiles = {};
  for (const inp of c.inputs) if (inp.multiple) { pickedFiles[inp.key] = []; renderFileList(inp.key); }
  document.getElementById('form').onsubmit = run;
}

// Fichiers accumules par champ "multiple" (cle input -> File[]), independants du DOM natif.
let pickedFiles = {};

function pickMore(key, accept) {
  const tmp = document.createElement('input');
  tmp.type = 'file'; tmp.multiple = true; if (accept) tmp.accept = accept;
  tmp.onchange = () => {
    pickedFiles[key].push(...tmp.files);
    renderFileList(key);
  };
  tmp.click();
}

function removeFile(key, idx) {
  pickedFiles[key].splice(idx, 1);
  renderFileList(key);
}

function renderFileList(key) {
  const ul = document.getElementById(`filelist-${key}`);
  if (!ul) return;
  ul.innerHTML = pickedFiles[key].map((f, i) => `
    <li><span class="fname">📄 ${f.name}</span><button type="button" onclick="removeFile('${key}',${i})" title="Retirer">✕</button></li>
  `).join('') || '<li style="color:var(--muted);border-style:dashed">Aucun fichier sélectionné</li>';
}

async function run(e) {
  e.preventDefault();
  // champs "multiple" requis mais vides (pickedFiles) : le navigateur ne peut pas
  // le valider lui-meme puisque ce ne sont plus de vrais <input required>.
  for (const inp of current.inputs) {
    if (inp.multiple && inp.required && !(pickedFiles[inp.key] || []).length) {
      alert(`${inp.label} : au moins un fichier est requis.`);
      return;
    }
  }
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Traitement…';
  const fd = new FormData(e.target);
  for (const inp of current.inputs) {
    if (inp.multiple) for (const f of (pickedFiles[inp.key] || [])) fd.append(inp.key, f);
  }
  fd.append('carrier', current.id);
  const r = document.getElementById('result');
  r.innerHTML = '<p class="spinner">Calcul en cours…</p>';
  try {
    const res = await fetch('/api/process', { method:'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    renderResult(data);
  } catch (err) {
    r.innerHTML = `<div class="card"><div class="plan-note">❌ ${err.message}</div></div>`;
  } finally { btn.disabled = false; btn.textContent = "Générer l'import + le classeur"; }
}

function renderResult(d) {
  const totaux = d.totaux || {};
  const hasTotals = Object.keys(totaux).length > 0;
  const rows = Object.entries(totaux).map(([k,v])=>`<tr><td>${k}</td><td class="n">${v.toFixed(2)}</td></tr>`).join('');
  const icons = { workbook: '📊', xlsx: '📥', csv: '📄' };
  const downloads = d.downloads || {};
  const fileItems = Object.entries(downloads).filter(([k])=>k!=='multi').map(([k,x])=>`<li>${icons[k]||'📄'} ${x.name}</li>`).join('')
    + (downloads.multi || []).map((m)=>`<li>📄 ${m.csv.name} (${m.lignes} lignes)</li><li>📥 ${m.xlsx.name}</li>`).join('');
  document.getElementById('result').innerHTML = `
    <div class="card"><h3>2. Résultat — ${d.lignes} lignes</h3>
      ${hasTotals ? `<div class="total">${d.totalHt.toFixed(2)} € HT</div>
      <table><thead><tr><th>Poste</th><th style="text-align:right">Montant €</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
      <div class="kv" style="margin-top:12px"><b>${d.alerts.length} alerte(s) à vérifier</b>${(d.infos||[]).length?` · ${d.infos.length} info(s) (normal)`:''}</div>
      ${d.alerts.length?`<div class="alerts">${d.alerts.map(a=>`<div>⚠️ ${a}</div>`).join('')}</div>`:''}
      ${(d.infos||[]).length?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted)">ℹ️ ${d.infos.length} ligne(s) affrètement/navette — zone volontairement vide (hors grille tarifaire)</summary><div class="alerts" style="color:#7dd3fc">${d.infos.map(a=>`<div>${a}</div>`).join('')}</div></details>`:''}
    </div>
    <div class="card"><h3>3. Fichiers générés${d.periode ? ' — période ' + d.periode : ''}</h3>
      ${downloads.workbook ? (d.classeurClone ? '<div class="kv" style="color:#7dd3fc">📊 Classeur = <b>copie fidèle</b> du fichier fait à la main (feuilles, formules, pivots, mise en forme)</div>' : '<div class="kv">📊 Classeur en version simplifiée (Excel non disponible)</div>') : ''}
      <div class="kv" style="margin-top:8px">✅ Enregistrés dans le dossier <b>outputs\\${d.stamp}\\</b> :</div>
      <ul style="margin:6px 0 14px 20px;color:#cbd5e1;line-height:1.9">${fileItems}</ul>
      <button class="go" onclick="reveal('${d.stamp}')">📂 Ouvrir le dossier</button>
    </div>`;
}

async function reveal(stamp) {
  try { await fetch('/api/reveal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stamp }) }); }
  catch (e) { /* dossier accessible manuellement dans outputs/ */ }
}

load();
</script>
</body>
</html>
