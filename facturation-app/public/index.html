<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚚</text></svg>" />
<title>Facturation Transporteurs</title>
<style>
  :root { --bg:#080b14; --bg2:#0d1220; --panel:#131a2b; --panel-hover:#161f35; --muted:#64748b; --line:#233047; --fg:#e5eaf5;
          --accent:#38bdf8; --accent2:#a855f7; --ok:#22c55e; --warn:#f59e0b; --plan:#475569; }
  * { box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; } }
  html { scrollbar-color: var(--line) transparent; }
  body {
    margin:0; font:14px/1.55 system-ui,Segoe UI,Roboto,sans-serif; color:var(--fg);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(56,189,248,.14), transparent 60%),
      radial-gradient(700px 480px at 100% 0%, rgba(168,85,247,.12), transparent 55%),
      linear-gradient(var(--bg), var(--bg2)) fixed;
    background-attachment: fixed;
    position: relative;
    min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35;
    background-image:
      linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
  }
  header, .layout { position:relative; z-index:1; }
  header { padding:18px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;
           backdrop-filter: blur(6px); background: rgba(8,11,20,.55); }
  header h1 { font-size:17px; margin:0; font-weight:700; letter-spacing:.01em;
              background: linear-gradient(120deg, var(--fg), var(--accent) 65%, var(--accent2));
              -webkit-background-clip: text; background-clip:text; color:transparent; }
  header .sub { color:var(--muted); font-size:13px; }
  .layout { min-height:calc(100vh - 57px); }
  main { max-width:1100px; margin:0 auto; padding:24px 28px; overflow:auto; }
  .back { display:inline-flex; align-items:center; gap:8px; background:none; border:0; color:var(--muted);
          cursor:pointer; font-size:16px; font-weight:600; padding:8px 0; margin-bottom:14px; transition:color .15s ease, transform .15s ease; }
  .back:hover { color:var(--accent); transform:translateX(-2px); }
  .badge { font-size:10px; padding:2px 7px; border-radius:999px; font-weight:600; }
  .badge.ready { background:rgba(34,197,94,.15); color:var(--ok); }
  .badge.planned { background:rgba(71,85,105,.35); color:#94a3b8; }
  .badge.viti { background:rgba(56,189,248,.15); color:var(--accent); }
  .card { background:linear-gradient(165deg, var(--panel), var(--bg2)); border:1px solid var(--line); border-radius:14px;
          padding:20px 22px; margin-bottom:16px; box-shadow:0 8px 24px -12px rgba(0,0,0,.5);
          animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .card h3 { margin:0 0 6px; font-size:16px; letter-spacing:.01em; }
  .kv { color:var(--muted); font-size:13px; margin-top:6px; }
  .kv b { color:#cbd5e1; font-weight:600; }
  .drop { border:1.5px dashed var(--line); border-radius:10px; padding:14px; margin:10px 0; transition:border-color .18s ease, background .18s ease; }
  .drop:focus-within, .drop:hover { border-color: rgba(56,189,248,.5); background: rgba(56,189,248,.03); }
  .drop label { display:block; font-weight:600; margin-bottom:6px; }
  .drop input { width:100%; color:var(--muted); }
  .drop .req { color:var(--warn); }
  .filelist { list-style:none; margin:0 0 8px; padding:0; display:flex; flex-direction:column; gap:5px; }
  .filelist li { display:flex; align-items:center; gap:8px; background:#0b1222; border:1px solid var(--line);
                 border-radius:7px; padding:6px 10px; font-size:12.5px; color:#cbd5e1; }
  .filelist li .fname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .filelist li button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 2px; }
  .filelist li button:hover { color:#ef4444; }
  .addfile { background:#0b1222; border:1px dashed var(--line); color:var(--muted); border-radius:7px;
             padding:7px 12px; cursor:pointer; font-size:12.5px; transition:border-color .15s ease, color .15s ease, box-shadow .15s ease; }
  .addfile:hover { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,.08); }
  button.go { background:linear-gradient(120deg, var(--accent), var(--accent2)); color:#04121f; border:0;
              padding:12px 22px; border-radius:10px; font-weight:700; cursor:pointer; font-size:14px;
              box-shadow:0 4px 20px -6px rgba(56,189,248,.55); transition:transform .15s ease, box-shadow .15s ease, filter .15s ease; }
  button.go:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 26px -6px rgba(56,189,248,.7); filter:brightness(1.05); }
  button.go:active:not(:disabled) { transform:translateY(0); }
  button.go:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.go:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
  .plan-note { color:var(--warn); background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25); border-radius:10px; padding:12px 14px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td,th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .total { font-size:26px; font-weight:800; letter-spacing:-.01em;
           background:linear-gradient(120deg, var(--ok), #6ee7b7); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .dl a { display:inline-block; margin-right:10px; margin-top:8px; background:#0b1222; border:1px solid var(--line);
          color:var(--fg); padding:9px 14px; border-radius:8px; text-decoration:none; transition:border-color .15s ease; }
  .dl a:hover { border-color:var(--accent); }
  .alerts { max-height:220px; overflow:auto; font-size:12.5px; color:#fbbf24; margin-top:8px; }
  .alerts div { padding:2px 0; }
  .spinner { color:var(--muted); display:flex; align-items:center; gap:10px; }
  .spinner::before { content:''; width:14px; height:14px; border-radius:50%;
                      border:2px solid var(--line); border-top-color:var(--accent); animation:spin .7s linear infinite; }

  header h1 { cursor:pointer; transition:filter .15s ease; }
  header h1:hover { filter:brightness(1.25); }

  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes floatGlow { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-2%, 2%); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }

  .home { padding:32px 0 40px; position:relative; }
  .home h2 { font-size:30px; font-weight:800; letter-spacing:-.01em; margin:0 0 8px; text-align:center;
             background:linear-gradient(120deg, var(--fg) 20%, var(--accent) 60%, var(--accent2));
             -webkit-background-clip:text; background-clip:text; color:transparent;
             text-wrap:balance; }
  .home .home-sub { display:block; text-align:center; color:var(--muted); font-size:13.5px; margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:18px; }
  .tile { background:linear-gradient(165deg, var(--panel), var(--bg2)); border:1px solid var(--line); border-radius:16px;
          padding:24px 18px; display:flex; flex-direction:column; align-items:center; gap:12px; cursor:pointer;
          text-align:center; transition:transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s ease, box-shadow .2s ease;
          position:relative; opacity:0; animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards; }
  .tile:hover { transform:translateY(-4px); border-color:rgba(56,189,248,.55);
                box-shadow:0 14px 34px -14px rgba(56,189,248,.35), 0 0 0 1px rgba(56,189,248,.12); }
  .tile:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .tile-badge { width:72px; height:72px; border-radius:14px; display:flex; align-items:center; justify-content:center;
                font-weight:800; font-size:18px; letter-spacing:.02em; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25);
                box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .tile-logo-img { width:72px; height:72px; border-radius:14px; object-fit:contain; background:#fff; padding:8px;
                    transition:transform .2s ease; }
  .tile:hover .tile-logo-img { transform:scale(1.04); }
  .tile-name { font-size:14px; font-weight:600; line-height:1.25; }
  .tile-tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  .tile .badge { font-size:9px; }

  .carrier-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both; }
  .carrier-head .head-logo-img { width:48px; height:48px; border-radius:10px; object-fit:contain; background:#fff; padding:5px;
                                  box-shadow:0 2px 10px -4px rgba(56,189,248,.4); }
  .carrier-head .head-badge { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center;
                font-weight:800; font-size:13px; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.35); flex-shrink:0; }
  .carrier-head h3 { margin:0; font-size:19px; letter-spacing:.01em; }

  .month-field { margin:0 0 16px; }
  .month-field label { display:block; font-weight:600; margin-bottom:6px; }
  .month-field select { background:#0b1222; color:var(--fg); border:1px solid var(--line); border-radius:8px;
                         padding:9px 12px; font-size:14px; min-width:160px; cursor:pointer; transition:border-color .15s ease; }
  .month-field select:hover, .month-field select:focus { border-color:var(--accent); outline:none; }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">🚚 Facturation Transporteurs</h1>
  <span class="sub">Import + classeur, automatisés</span>
</header>
<div class="layout">
  <main id="main"><p class="spinner">Chargement…</p></main>
</div>

<script>
let CARRIERS = [], current = null;

// Couleurs de marque APPROXIMATIVES (pas de vrais logos disponibles pour l'instant).
// Pour brancher un vrai logo : deposer public/logos/<id>.png (ou .svg) -> pris automatiquement,
// le badge colore ne sert plus que de repli si l'image est absente/en erreur.
const BRANDS = {
  kuehne:        { initials: 'K+N', color: '#00447C' },
  delivengo:     { initials: 'DGO', color: '#8B2FC9' },
  dpd:           { initials: 'DPD', color: '#DC0032' },
  ups:           { initials: 'UPS', color: '#351C15' },
  geodis:        { initials: 'GEO', color: '#E9631A' },
  gls:           { initials: 'GLS', color: '#1D4EAF' },
  colissimo:     { initials: 'COL', color: '#D9A800' },
  chronopost:    { initials: 'CHR', color: '#E2007A' },
  fedex:         { initials: 'FDX', color: '#4D148C' },
  tnt:           { initials: 'TNT', color: '#FF6200' },
  mondial_relay: { initials: 'MR',  color: '#00A651' },
  lettres:       { initials: '✉',  color: '#64748B' },
  bls:           { initials: 'BLS', color: '#2563EB' },
};

// Cherche logos/<id>.svg puis logos/<id>.png ; repli sur le badge colore si aucun n'existe.
function logoOrBadge(c) {
  return `<img class="tile-logo-img" src="/logos/${c.id}.svg" alt="${c.name}" data-id="${c.id}" onerror="logoFallback(this)">`;
}

function logoFallback(img) {
  if (img.dataset.tried !== 'png') {
    img.dataset.tried = 'png';
    img.src = `/logos/${img.dataset.id}.png`;
    return;
  }
  const b = BRANDS[img.dataset.id] || { initials: img.alt.slice(0,3).toUpperCase(), color: '#475569' };
  const badge = document.createElement('div');
  badge.className = 'tile-badge';
  badge.style.background = b.color;
  badge.textContent = b.initials;
  img.replaceWith(badge);
}

async function load() {
  CARRIERS = await (await fetch('/api/carriers')).json();
  // prêts d'abord, puis planifiés
  CARRIERS.sort((a,b)=> (a.status==='ready'?0:1)-(b.status==='ready'?0:1) || a.name.localeCompare(b.name));
  goHome();
}

function goHome() {
  current = null;
  const m = document.getElementById('main');
  const tiles = CARRIERS.map((c, i) => `
    <div class="tile" style="animation-delay:${Math.min(i*35,350)}ms" onclick="select('${c.id}')" tabindex="0"
         onkeydown="if(event.key==='Enter')select('${c.id}')">
      ${logoOrBadge(c)}
      <div class="tile-name">${c.name}</div>
      <div class="tile-tags">
        ${c.viticolis?'<span class="badge viti">Viticolis</span>':''}
        <span class="badge ${c.status}">${c.status==='ready'?'prêt':'à venir'}</span>
      </div>
    </div>`).join('');
  m.innerHTML = `<div class="home"><h2>Choisir un transporteur</h2>
    <span class="home-sub">Génère le fichier d'import et le classeur de facturation à partir des documents reçus</span>
    <div class="grid">${tiles}</div></div>`;
}

// En-tête "logo/badge + nom" de la page de detail -- meme repli logo -> badge colore que sur
// les tuiles d'accueil (logoOrBadge/logoFallback), juste une taille differente (tile-logo-img
// vs head-logo-img).
function carrierHeadLogo(c) {
  return `<img class="head-logo-img" src="/logos/${c.id}.svg" alt="${c.name}" data-id="${c.id}" onerror="headLogoFallback(this)">`;
}
function headLogoFallback(img) {
  if (img.dataset.tried !== 'png') { img.dataset.tried = 'png'; img.src = `/logos/${img.dataset.id}.png`; return; }
  const b = BRANDS[img.dataset.id] || { initials: img.alt.slice(0,3).toUpperCase(), color: '#475569' };
  const badge = document.createElement('div');
  badge.className = 'head-badge';
  badge.style.background = b.color;
  badge.textContent = b.initials;
  img.replaceWith(badge);
}

// Mois de facturation propose par defaut (mois precedent, cas le plus frequent quand on
// facture "le mois dernier") + quelques mois autour pour ajuster -- champ INFORMATIF
// uniquement (decision utilisateur 2026-08-14) : sert a la verification visuelle avant envoi,
// la vraie periode utilisee pour nommer les fichiers reste calculee cote carrier depuis le
// contenu des documents deposes (voir d.periode affiche dans le resultat).
function monthOptions() {
  const now = new Date();
  const opts = [];
  for (let i = -1; i <= 2; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = `${d.getFullYear()}_${String(d.getMonth()+1).padStart(2,'0')}`;
    opts.push(`<option value="${val}" ${i===0?'selected':''}>${val.replace('_',' ')}</option>`);
  }
  return opts.join('');
}

function select(id) {
  current = CARRIERS.find(c=>c.id===id);
  render();
}

function render() {
  const c = current, m = document.getElementById('main');
  let html = `<button class="back" onclick="goHome()">← Autres transporteurs</button>
    <div class="carrier-head">${carrierHeadLogo(c)}<h3>${c.name}</h3></div>`;

  if (c.status !== 'ready') {
    html += `<div class="card"><div class="plan-note">⏳ Transporteur <b>planifié</b> — méthode connue, implémentation à venir.
      Documents attendus : ${(c.inputs||[]).map(i=>i.label).join(', ')||'à définir'}.</div></div>`;
    m.innerHTML = html; return;
  }

  html += `<div class="card"><h3>1. Déposer les documents fournis par ${c.name}</h3><form id="form">
    <div class="month-field"><label>Mois de facturation</label>
      <select id="month-select">${monthOptions()}</select>
    </div>`;
  for (const inp of c.inputs) {
    if (inp.multiple) {
      // fichiers accumules en JS (pickedFiles) : re-selectionner n'ecrase pas ceux deja choisis,
      // contrairement au comportement natif d'un <input type="file" multiple">.
      html += `<div class="drop" data-key="${inp.key}">
        <label>${inp.label} ${inp.required?'<span class="req">*</span>':''}</label>
        <ul class="filelist" id="filelist-${inp.key}"></ul>
        <button type="button" class="addfile" onclick="pickMore('${inp.key}','${inp.accept}')">+ Ajouter un ou plusieurs fichiers</button>
      </div>`;
    } else {
      html += `<div class="drop"><label>${inp.label} ${inp.required?'<span class="req">*</span>':''}</label>
        <input type="file" name="${inp.key}" accept="${inp.accept}" ${inp.required?'required':''}></div>`;
    }
  }
  html += `<button class="go" type="submit">Générer l'import + le classeur</button></form></div>
    <div id="result"></div>`;
  m.innerHTML = html;
  pickedFiles = {};
  for (const inp of c.inputs) if (inp.multiple) { pickedFiles[inp.key] = []; renderFileList(inp.key); }
  document.getElementById('form').onsubmit = run;
}

// Fichiers accumules par champ "multiple" (cle input -> File[]), independants du DOM natif.
let pickedFiles = {};

function pickMore(key, accept) {
  const tmp = document.createElement('input');
  tmp.type = 'file'; tmp.multiple = true; if (accept) tmp.accept = accept;
  tmp.onchange = () => {
    pickedFiles[key].push(...tmp.files);
    renderFileList(key);
  };
  tmp.click();
}

function removeFile(key, idx) {
  pickedFiles[key].splice(idx, 1);
  renderFileList(key);
}

function renderFileList(key) {
  const ul = document.getElementById(`filelist-${key}`);
  if (!ul) return;
  ul.innerHTML = pickedFiles[key].map((f, i) => `
    <li><span class="fname">📄 ${f.name}</span><button type="button" onclick="removeFile('${key}',${i})" title="Retirer">✕</button></li>
  `).join('') || '<li style="color:var(--muted);border-style:dashed">Aucun fichier sélectionné</li>';
}

async function run(e) {
  e.preventDefault();
  // champs "multiple" requis mais vides (pickedFiles) : le navigateur ne peut pas
  // le valider lui-meme puisque ce ne sont plus de vrais <input required>.
  for (const inp of current.inputs) {
    if (inp.multiple && inp.required && !(pickedFiles[inp.key] || []).length) {
      alert(`${inp.label} : au moins un fichier est requis.`);
      return;
    }
  }
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Traitement…';
  const monthChosen = document.getElementById('month-select')?.value || '';
  const fd = new FormData(e.target);
  for (const inp of current.inputs) {
    if (inp.multiple) for (const f of (pickedFiles[inp.key] || [])) fd.append(inp.key, f);
  }
  fd.append('carrier', current.id);
  const r = document.getElementById('result');
  r.innerHTML = '<p class="spinner">Calcul en cours…</p>';
  try {
    const res = await fetch('/api/process', { method:'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    renderResult(data, monthChosen);
  } catch (err) {
    r.innerHTML = `<div class="card"><div class="plan-note">❌ ${err.message}</div></div>`;
  } finally { btn.disabled = false; btn.textContent = "Générer l'import + le classeur"; }
}

function renderResult(d, monthChosen) {
  const totaux = d.totaux || {};
  // Mois choisi purement informatif (pas transmis au serveur) : la vraie periode calculee
  // depuis les documents fait foi -- simple alerte visuelle en cas d'ecart, pas un blocage.
  const monthMismatch = monthChosen && d.periode && monthChosen !== d.periode;
  const hasTotals = Object.keys(totaux).length > 0;
  const rows = Object.entries(totaux).map(([k,v])=>`<tr><td>${k}</td><td class="n">${v.toFixed(2)}</td></tr>`).join('');
  const icons = { workbook: '📊', xlsx: '📥', csv: '📄' };
  const downloads = d.downloads || {};
  const fileItems = Object.entries(downloads).filter(([k])=>k!=='multi').map(([k,x])=>`<li>${icons[k]||'📄'} ${x.name}</li>`).join('')
    + (downloads.multi || []).map((m)=>`<li>📄 ${m.csv.name} (${m.lignes} lignes)</li><li>📥 ${m.xlsx.name}</li>`).join('');
  document.getElementById('result').innerHTML = `
    <div class="card"><h3>2. Résultat — ${d.lignes} lignes</h3>
      ${hasTotals ? `<div class="total">${d.totalHt.toFixed(2)} € HT</div>
      <table><thead><tr><th>Poste</th><th style="text-align:right">Montant €</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
      <div class="kv" style="margin-top:12px"><b>${d.alerts.length} alerte(s) à vérifier</b>${(d.infos||[]).length?` · ${d.infos.length} info(s) (normal)`:''}</div>
      ${d.alerts.length?`<div class="alerts">${d.alerts.map(a=>`<div>⚠️ ${a}</div>`).join('')}</div>`:''}
      ${(d.infos||[]).length?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted)">ℹ️ ${d.infos.length} ligne(s) affrètement/navette — zone volontairement vide (hors grille tarifaire)</summary><div class="alerts" style="color:#7dd3fc">${d.infos.map(a=>`<div>${a}</div>`).join('')}</div></details>`:''}
    </div>
    <div class="card"><h3>3. Fichiers générés${d.periode ? ' — période ' + d.periode : ''}</h3>
      ${monthMismatch ? `<div class="kv" style="color:var(--warn)">⚠️ Mois choisi (${monthChosen.replace('_',' ')}) différent de la période détectée dans les documents (${d.periode.replace('_',' ')}) — vérifiez les fichiers déposés.</div>` : ''}
      ${downloads.workbook ? (d.classeurClone ? '<div class="kv" style="color:#7dd3fc">📊 Classeur = <b>copie fidèle</b> du fichier fait à la main (feuilles, formules, pivots, mise en forme)</div>' : '<div class="kv">📊 Classeur en version simplifiée (Excel non disponible)</div>') : ''}
      <div class="kv" style="margin-top:8px">✅ Enregistrés dans le dossier <b>outputs\\${d.stamp}\\</b> :</div>
      <ul style="margin:6px 0 14px 20px;color:#cbd5e1;line-height:1.9">${fileItems}</ul>
      <button class="go" onclick="reveal('${d.stamp}')">📂 Ouvrir le dossier</button>
    </div>`;
}

async function reveal(stamp) {
  try { await fetch('/api/reveal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stamp }) }); }
  catch (e) { /* dossier accessible manuellement dans outputs/ */ }
}

load();
</script>
</body>
</html>
